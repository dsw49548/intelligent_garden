[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_port = /dev/ttyUSB0
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    claws/BH1750@^1.3.0
    bogde/HX711@^0.7.5

; 921600 (domyslne) nie dziala na tej plytce
upload_speed = 115200
; komendy wpisywane w monitorze VS Code: widoczne i konczone \n
monitor_echo = yes
monitor_eol = LF
