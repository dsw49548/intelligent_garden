[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_port = /dev/ttyUSB0
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    claws/BH1750@^1.3.0
    bblanchon/ArduinoJson@^7

; the default 921600 does not work with this board
upload_speed = 115200
; serial commands typed in the VS Code monitor: echoed and terminated with \n
monitor_echo = yes
monitor_eol = LF
